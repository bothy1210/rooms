# ============================================================
# Nginx server block — UZ Room Inventory & Usage Monitoring System
# Install to: /etc/nginx/sites-available/roomsys.conf
# Enable:     ln -s /etc/nginx/sites-available/roomsys.conf /etc/nginx/sites-enabled/
#             nginx -t && systemctl reload nginx
# ============================================================

# Redirect all HTTP to HTTPS.
server {
    listen 80;
    server_name rooms.uz.ac.zw;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name rooms.uz.ac.zw;

    # ── TLS (point these at your certificate; certbot paths shown) ──
    ssl_certificate     /etc/letsencrypt/live/rooms.uz.ac.zw/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rooms.uz.ac.zw/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Max upload size (room photos).
    client_max_body_size 10M;

    # ── Static files (collected by `manage.py collectstatic`) ──
    location /static/ {
        alias /var/roomsys/static/;
        expires 30d;
        access_log off;
    }

    # ── Uploaded media (room photos) ──
    location /media/ {
        alias /var/roomsys/media/;
        expires 7d;
        access_log off;
    }

    # ── Application (proxied to Gunicorn via Unix socket) ──
    location / {
        proxy_pass http://unix:/run/roomsys.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
