{% extends "base.html" %}
{% block title %}Notifications{% endblock %}
{% block content %}
  <div style="display:flex;align-items:center;margin-bottom:16px">
    <h2 style="margin:0;font-size:18px">Notifications</h2>
    <form method="post" action="{% url 'notifications:mark_read' %}" style="margin-left:auto">
      {% csrf_token %}
      <button class="btn btn-ghost btn-sm" type="submit">Mark all read</button>
    </form>
  </div>
  <div class="card">
    <table>
      <tbody>
        {% for n in notifications %}
        <tr>
          <td style="width:14px">{% if not n.is_read %}<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--blue)"></span>{% endif %}</td>
          <td>{{ n.message }}<br><span style="color:var(--muted);font-size:11.5px">{{ n.created_at|date:"j M Y, H:i" }}</span></td>
        </tr>
        {% empty %}
        <tr><td><div class="empty" style="padding:30px;text-align:center;color:var(--muted)">No notifications.</div></td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
{% endblock %}
